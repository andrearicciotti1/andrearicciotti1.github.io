name: Deploy redirect to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Create redirect page
        run: |
          mkdir dist
          cat > dist/index.html << 'EOF'
          <!doctype html>
          <html lang="it">
          <head>
            <meta charset="utf-8">
            <title>Andrea Ricciotti</title>
            <meta http-equiv="refresh" content="0; url=https://andrearicciotti.netlify.app/">
            <link rel="canonical" href="https://andrearicciotti.netlify.app/">
          </head>
          <body>
            <p>Redirecting to <a href="https://andrearicciotti.netlify.app/">andrearicciotti.netlify.app</a>…</p>
            <script>window.location.replace("https://andrearicciotti.netlify.app/");</script>
          </body>
          </html>
          EOF
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
